# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json

# For more information, visit https://github.com/amnweb/yasb/wiki
watch_stylesheet: true
watch_config: true
debug: true
update_check: true
# Dipakai oleh menu tray YASB (klik kanan ikon YASB > Komorebi).
# Lewat komorebi-ctl.vbs supaya komorebi start elevated dengan --config.
# Path di-patch ke username device ini oleh install.ps1.
komorebi:
  start_command: "wscript //nologo C:/Users/daffa/.config/komorebi-extra/komorebi-ctl.vbs start"
  stop_command: "wscript //nologo C:/Users/daffa/.config/komorebi-extra/komorebi-ctl.vbs stop"
  reload_command: "wscript //nologo C:/Users/daffa/.config/komorebi-extra/komorebi-ctl.vbs restart"
bars:
  primary-bar:
    enabled: true
    screens: ["primary"]
    class_name: yasb-bar
    style: "adaptive"
    alignment:
      position: top
      align: center
    animation:
      enabled: true
      duration: 200
    blur_effect:
      enabled: false
      dark_mode: false
      round_corners: false
      border_color: None
    window_flags:
      always_on_top: true
      windows_app_bar: true
      # Sembunyikan bar saat ada window fullscreen (video, game).
      # Tanpa ini, always_on_top membuat bar tetap menimpa video fullscreen.
      hide_on_fullscreen: true
      hide_on_maximized: false
      auto_hide: false
    dimensions:
      width: "100%"
      height: 36
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
      - quick_launch
      - komorebi_workspaces
      - komorebi_active_layout
      - afterburner

      center:
      - taskbar
      right:
      - komorebi_stack
      - media
      - audio_visualizer
      - komorebi_ctl
      - systray
      # - open_meteo
      # - wallpapers
      - github
      - notifications
      - volume
      - clock
      - control_center
  # Bar ringkas untuk monitor kedua (1366x768). Nama screen dari
  # `yasbc monitor-information`; ganti kalau monitornya beda.
  # Widget komorebi otomatis menampilkan workspace milik monitor tempat bar ini.
  secondary-bar:
    enabled: true
    screens: ["LG HD"]
    class_name: yasb-bar
    style: "adaptive"
    alignment:
      position: top
      align: center
    animation:
      enabled: true
      duration: 200
    blur_effect:
      enabled: false
      dark_mode: false
      round_corners: false
      border_color: None
    window_flags:
      always_on_top: true
      windows_app_bar: true
      hide_on_fullscreen: true
      hide_on_maximized: false
      auto_hide: false
    dimensions:
      width: "100%"
      height: 36
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
      - komorebi_workspaces
      - komorebi_active_layout
      center:
      - taskbar
      right:
      - komorebi_stack
      - clock
widgets:
  wallpapers:
    type: "yasb.wallpapers.WallpapersWidget"
    options:
      label: "<span>\ue7aa</span>"
      image_path: "C:/Users/daffa/Pictures" 
      engine:
        enabled: true
        animation: "split"
      gallery:
        type: "strip"
        image_width: 240
        accent_color: "#fff"
        orientation: "portrait"
        image_corner_radius: 0
      keybindings:
      - keys: alt+e
        action: toggle_gallery
        screen: cursor
  taskbar:
    type: "yasb.taskbar.TaskbarWidget"
    options:
      icon_size: 16
      tooltip: true
      show_only_visible: true
      strict_filtering: true
      monitor_exclusive: false
      hide_empty: true
      grouping:
        enabled: true
        show_count: false
      animation:
        enabled: true
        duration: 200
      preview:
        enabled: true
        width: 180
        delay: 400
        padding: 8
        margin: 8
        blur: true
        peek: true
      title_label:
        enabled: false
  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "{title}{s}{artist}"
      label_alt: "{title}"
      separator: " - "
      hide_empty: true
      max_field_size:
        label: 28
        label_alt: 40
        truncate_whole_label: false
      show_thumbnail: true
      controls_only: false
      controls_left: false
      controls_hide: true
      thumbnail_alpha: 70
      thumbnail_padding: 6
      thumbnail_corner_radius: 12
      symmetric_corner_radius: true
      thumbnail_edge_fade: false
      icons:
        prev_track: ""
        next_track: ""
        play: ""
        pause: ""
      media_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        thumbnail_corner_radius: 8
        thumbnail_size: 120
        max_title_size: 60
        max_artist_size: 20
        max_source_size: 16
        show_source: true
        show_volume_slider: true
      scrolling_label:
        enabled: true
        update_interval_ms: 33
        style: "left"
        separator: " | "
        label_padding: 0
        always_scroll: false
        ease_slope: 20
        ease_pos: 0.8
        ease_min: 0.5
      callbacks:
        on_left: "toggle_media_menu"
        on_middle: "toggle_play_pause"
        on_right: "toggle_label"
  audio_visualizer:
    type: "yasb.audio_visualizer.AudioVisualizerWidget"
    options:
      edge_fade: 0
      mirror: true
      style: bars
      height: 16
      smoothness: 80
      sensitivity: 50
      auto_gain: true
      framerate: 30
      freq_min: 500
      freq_max: 12000
      hide_idle: true
      hide_idle_after: 3000
      channels: stereo
      mono_option: average
      reverse: false
      bars:
        count: 6
        width: 1
        gap: 4
      waves:
        width: 40
      dots:
        count: 16
        size: 1
        gap: 3
  control_center:
    type: "yasb.control_center.ControlCenterWidget"
    options:
      label: "<span>\uE712</span>"
      tooltip: true
      sections_order:
        - "system_controls"
        - "quick_actions"
        - "sliders"
        - "power"
        - "media"
      popup:
        alignment: "right"
        direction: "down"
        border_color: System
        round_corners: true
        round_corners_type: normal
        offset_top: 8
      sections:
        system_controls:
          profile_image_size: 28
          power_icon: "\uE7E8"
          lock_icon: "\uE72E"
          settings_icon: "\uE713"
        quick_actions:
          show: true
          columns: 3
          label_position: "default"
          actions:
            - id: "toggle_dnd"
              label: "Do Not Disturb"
              icon: "\uf285"
            - id: "toggle_mute"
              label: "Mute"
              icon: "\ue74f"
            - id: "toggle_mic_mute"
              label: "Mic Mute"
              icon: "\uF12E"
            - id: "screenshot"
              label: "Screenshot"
              icon: "\ue91b"
            - id: "touch_keyboard"
              label: "Keyboard"
              icon: "\uE765"
            - id: "toggle_theme"
              label: "Dark Mode"
              icon: "\uE708"
        sliders:
          show: true
          brightness:
            show_slider: true
            icon: "\uE706"
            show_source_selector: true
            source_selector_icon: "\uE972"
          volume:
            show_slider: true
            icon: "\uE767"
            show_source_selector: true
            source_selector_icon: "\uE972"
          microphone:
            show_slider: true
            icon: "\uE720"
            show_source_selector: true
            source_selector_icon: "\uE972"
        media:
          show: true
          thumbnail_size: 36
          thumbnail_radius: 4
          icons:
            prev_track: "\ue622"
            next_track: "\ue623"
            play: "\uf5b0"
            pause: "\ue62e"
        power:
          show: true
          power_plan_title: "Power Plan"
          power_mode_title: "Power Mode"
          button_menu_icon: "\ue76c"
      callbacks:
        on_left: "toggle_menu"
  # Kept for reference / fallback to Windows virtual desktops.
  # Not referenced by any bar, so YASB will not instantiate it.
  windows_workspaces:
    type: "yasb.windows_desktops.WorkspaceWidget"
    options:
      label_workspace_btn: ""
      label_workspace_active_btn: ""
      callbacks:
        on_left: "activate_workspace"
        on_middle: "do_nothing"
        on_right: "toggle_context_menu"
  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_offline: ""
      # Empty labels -> buttons render as pure dots, exactly like the
      # original yasb.windows_desktops widget did.
      label_workspace_btn: ""
      label_workspace_active_btn: ""
      label_workspace_populated_btn: ""
      label_default_name: ""
      label_zero_index: false
      # Only the active + occupied workspaces are shown, never all 7.
      hide_empty_workspaces: true
      hide_if_offline: false
      label_float_override: ""
      enable_scroll_switching: true
      reverse_scroll_direction: false
      app_icons:
        enabled_populated: false
        enabled_active: false
        size: 14
        max_icons: 0
        hide_label: false
        hide_duplicates: true
        hide_floating: false
      toggle_workspace_layer:
        enabled: false
        tiling_label: ""
        floating_label: ""
  komorebi_active_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"
    options:
      label: "<span>{icon}</span>"
      hide_if_offline: true
      layouts:
      - "bsp"
      - "columns"
      - "rows"
      - "grid"
      - "vertical_stack"
      - "horizontal_stack"
      - "ultrawide_vertical_stack"
      - "right_main_vertical_stack"
      - "scrolling"
      layout_icons:
        bsp: ""
        columns: ""
        rows: ""
        grid: ""
        scrolling: ""
        vertical_stack: ""
        horizontal_stack: ""
        ultrawide_vertical_stack: ""
        right_main_vertical_stack: ""
        monocle: ""
        maximized: ""
        floating: ""
        paused: ""
        tiling: ""
      layout_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: left
        direction: down
        offset_top: 6
        offset_left: 0
        show_layout_icons: true
      callbacks:
        on_left: "toggle_layout_menu"
        on_middle: "toggle_monocle"
        on_right: "next_layout"
  komorebi_stack:
    type: "komorebi.stack.StackWidget"
    options:
      # Icon-only tabs: empty labels leave just the app icon per window.
      label_window: ""
      label_window_active: ""
      label_no_window: ""
      label_offline: ""
      label_zero_index: false
      hide_if_offline: true
      show_icons: "always"
      icon_size: 16
      show_only_stack: true
      enable_scroll_switching: true
      reverse_scroll_direction: false
  komorebi_ctl:
    type: "yasb.custom.CustomWidget"
    options:
      label: "<span></span>"
      label_alt: "<span></span>"
      class_name: "komorebi-ctl-widget"
      tooltip: true
      tooltip_label: "komorebi\nKlik kiri: restart\nKlik tengah: start\nKlik kanan: stop"
      exec_options:
        use_shell: false
      callbacks:
        on_left: "exec wscript //nologo C:/Users/daffa/.config/komorebi-extra/komorebi-ctl.vbs restart"
        on_middle: "exec wscript //nologo C:/Users/daffa/.config/komorebi-extra/komorebi-ctl.vbs start"
        on_right: "exec wscript //nologo C:/Users/daffa/.config/komorebi-extra/komorebi-ctl.vbs stop"
  # Sensor CPU + GPU dari MSI Afterburner.
  #
  # Afterburner mengekspos semua sensor monitoring-nya lewat shared memory
  # "MAHMSharedMemory". scripts/afterburner-stats.ps1 membacanya dan mencetak
  # JSON; key yang dipakai di label/tooltip di bawah adalah key JSON itu.
  # Jalankan script itu langsung untuk melihat semua key yang tersedia, atau
  # dengan -Raw untuk melihat daftar sensor mentah dari Afterburner.
  #
  # Syarat: MSI Afterburner harus JALAN dan sensor yang mau dipakai harus
  # dicentang di Settings > Monitoring. Sensor yang tidak dicentang tidak masuk
  # shared memory dan keluar sebagai "--".
  #
  # hide_empty: true -> widget menghilang total kalau Afterburner tidak jalan
  # (script mencetak "{}"). Set false kalau lebih suka tetap lihat "--".
  afterburner:
    type: "yasb.custom.CustomWidget"
    options:
      class_name: "afterburner-widget"
      label: "<span class='icon cpu'>\uF4BC</span>{data[cpu_usage]}% {data[cpu_temp]}°<span class='icon gpu'>\U000F08AE</span>{data[gpu_usage]}% {data[gpu_temp]}°"
      label_alt: "<span class='icon cpu'>\uF4BC</span>{data[cpu_temp]}° {data[cpu_clock_ghz]}GHz {data[cpu_power]}W<span class='icon gpu'>\U000F08AE</span>{data[gpu_temp]}° {data[gpu_core_clock]}MHz {data[gpu_power]}W"
      label_placeholder: "--"
      tooltip: true
      # Key lain yang juga disediakan script tapi tidak dipakai di sini karena
      # RX 580 tidak melaporkannya: gpu_hotspot, gpu_mem_temp, gpu_voltage,
      # gpu_power_pct, gpu_vram_total, gpu_vram_gb, gpu_vram_pct, cpu_clock, fps.
      # Kartu Nvidia / RDNA umumnya mengisi sebagian besarnya - tambahkan saja.
      tooltip_label: "CPU   {data[cpu_temp]}°C · {data[cpu_usage]}% · {data[cpu_clock_ghz]} GHz · {data[cpu_power]} W\nGPU   {data[gpu_temp]}°C · {data[gpu_usage]}% · {data[gpu_core_clock]} MHz · {data[gpu_power]} W\nVRAM  {data[gpu_vram_used]} MB · mem clock {data[gpu_mem_clock]} MHz\nFan   {data[gpu_fan]}% · {data[gpu_fan_rpm]} RPM\nRAM   {data[ram_used_gb]} GB · {data[gpu_name]} · update {data[polled]}"
      exec_options:
        # Path di-patch ke username device ini oleh install.ps1.
        #
        # JANGAN kasih tanda kutip di sekitar path. YASB memecah run_cmd dengan
        # run_cmd.split(' ') jadi list argumen (core/widgets/yasb/custom.py),
        # bukan lewat shell, jadi kutipnya ikut masuk ke argumen dan PowerShell
        # menolak dengan "Illegal characters in path".
        # Konsekuensinya: path ini tidak boleh mengandung spasi - install.ps1
        # otomatis memakai short path 8.3 kalau username-nya berspasi.
        run_cmd: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File C:/Users/daffa/.config/yasb/scripts/afterburner-stats.ps1
        # Afterburner sendiri polling tiap 1000 ms; 2000 ms sudah cukup halus
        # dan menahan biaya spawn powershell (~200 ms) tetap kecil.
        run_interval: 2000
        return_format: "json"
        hide_empty: true
        # false = langsung CreateProcess, tanpa cmd.exe perantara.
        use_shell: false
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: 'exec "C:\Program Files (x86)\MSI Afterburner\MSIAfterburner.exe"'
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%H:%M}<span>{alarm}</span>'
      label_alt: '{%a, %d %b %H:%M}'
      timezones: []
      calendar:
        blur: true
        round_corners: true
        alignment: center
        direction: down
        extended: false
        show_years: true
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: toggle_calendar
        on_middle: toggle_label
        on_right: context_menu
  volume:
    type: yasb.volume.VolumeWidget
    options:
      label: <span>{icon}</span>
      label_alt: <span>{icon}</span>{level}
      tooltip: true
      icons:
        muted: "\uE74F"
        '5': "\uE995"
        '10': "\uE995"
        '20': "\uE995"
        '50': "\uE995"
        '100': "\uE995"
      callbacks:
        on_left: toggle_volume_menu
        on_right: toggle_mute
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: center
        direction: down
        show_apps: true
        show_app_labels: false
        show_app_icons: true
        show_apps_expanded: false
        app_icons:
          toggle_down: "\uE972"
          toggle_up: "\uE971"
  notifications:
    type: yasb.notifications.NotificationsWidget
    options:
      label: "<span>{icon}</span>"
      label_alt: '{count} notifications'
      hide_empty: false
      tooltip: false
      icons:
        new: "\ued0c"
        default: "\ue91c"
      callbacks:
        on_left: "toggle_notification"
        on_right: clear_notifications
        on_middle: do_nothing
  quick_launch:
    type: yasb.quick_launch.QuickLaunchWidget
    options:
      label: "<span>\uE71E</span>"
      search_placeholder: Search applications...
      max_results: 30
      show_icons: true
      icon_size: 16
      compact_text: true
      home_page: false
      providers:
        apps:
          enabled: true
          prefix: '*'
          priority: 0
          show_recent: true
          max_recent: 5
          show_description: true
      popup:
        width: 720
        height: 480
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: System
        dark_mode: true
      callbacks:
        on_left: toggle_quick_launch
      keybindings:
      - keys: alt+space
        action: toggle_quick_launch
        screen: active
  systray:
    type: yasb.systray.SystrayWidget
    options:
      class_name: systray
      label_collapsed: "\uE972"
      label_expanded: "\uE971"
      label_position: right
      pin_click_modifier: ctrl
      show_unpinned: false
      show_battery: false
      show_volume: false
      icon_size: 16
      use_hook: true
      show_in_popup: true
      icons_per_row: 5
      popup:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: center
        direction: down
        offset_top: 6
        offset_left: 0
  open_meteo:
    type: yasb.open_meteo.OpenMeteoWidget
    options:
      label: "<span>\uE706</span>"
      label_alt: "<span>\uE706</span> Current {temp}, Min {min_temp}, Max {max_temp}"
      tooltip: true
      update_interval: 600
      hide_decimal: true
      units: metric
      callbacks:
        on_left: toggle_card
        on_middle: do_nothing
        on_right: toggle_label
      icons:
        sunnyDay: "\uE706"
        clearNight: "\uEC46"
      weather_card:
        blur: true
        alignment: left
        border_color: System
        direction: down
        icon_size: 32
        show_hourly_forecast: true
        time_format: 24h
        hourly_point_spacing: 76
        hourly_icon_size: 16
        icon_smoothing: true
        temp_line_width: 2
        current_line_color: '#8EAEE8'
        current_line_width: 1
        current_line_style: dot
        hourly_forecast_buttons:
          enabled: false
        weather_animation:
          enabled: true
          snow_overrides_rain: true
          temp_line_animation_style: both
          rain_effect_intensity: 1.0
          snow_effect_intensity: 1.0
          scale_with_chance: true
  github:
    type: yasb.github.GithubWidget
    options:
      label: "<span>\ueb00</span>"
      label_alt: Notifications {data}
      max_notification: 30
      notification_dot:
        enabled: true
        corner: top_right
        color: '#ef4747'
        margin:
        - 0
        - 5
      # true = hanya ambil notifikasi yang belum dibaca. Selain mengurangi
      # request, ini menghentikan query ke repo yang sudah dihapus/di-rename
      # (sumber warning "Could not resolve to a Repository" di yasb.log).
      only_unread: true
      show_comment_count: true
      max_field_size: 54
      update_interval: 600
      icons:
        comment: "\uE90A"
      menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: left
        direction: down
        show_categories: true
        categories_order:
        - Issue
        - PullRequest
        - CheckSuite
        - Release
        - Discussion